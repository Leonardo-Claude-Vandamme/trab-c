<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Minha Biblioteca</h1>

    <div id="mensagem" class="alert d-none" role="alert"></div>

    <section class="card mb-4">
      <div class="card-body">
        <h2 id="titulo-formulario" class="h4">Cadastrar material</h2>
        <form id="form-material">
          <input id="id" type="hidden">

          <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <select id="tipo" class="form-select">
              <option value="livro">Livro</option>
              <option value="revista">Revista</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input id="titulo" class="form-control" required>
          </div>

          <div id="campos-livro">
            <div class="mb-3">
              <label for="autor" class="form-label">Autor</label>
              <input id="autor" class="form-control">
            </div>
            <div class="mb-3">
              <label for="paginas" class="form-label">Páginas</label>
              <input id="paginas" class="form-control" type="number" min="1">
            </div>
          </div>

          <div id="campos-revista" class="d-none">
            <div class="mb-3">
              <label for="edicao" class="form-label">Edição</label>
              <input id="edicao" class="form-control">
            </div>
            <div class="mb-3">
              <label for="mes" class="form-label">Mês de publicação</label>
              <input id="mes" class="form-control" type="number" min="1" max="12">
            </div>
          </div>

          <button id="botao-salvar" class="btn btn-primary" type="submit">Cadastrar</button>
          <button id="botao-cancelar" class="btn btn-secondary d-none" type="button">Cancelar</button>
        </form>
      </div>
    </section>

    <section>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Materiais cadastrados</h2>
        <button id="botao-atualizar" class="btn btn-outline-primary" type="button">Atualizar lista</button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Tipo</th>
              <th>Informações</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-materiais"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
